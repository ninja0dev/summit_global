<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Teste de Configuração - Summit Global</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      padding: 20px;
      background: linear-gradient(135deg, #0a0a0f 0%, #000 100%);
      color: #0f0;
      line-height: 1.6;
      min-height: 100vh;
    }

    h1 {
      color: #f1c40f;
      margin-bottom: 20px;
      text-align: center;
      font-size: 24px;
      text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
    }

    h2 {
      color: #3498db;
      margin-top: 30px;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 10px;
      border: 1px solid rgba(241, 196, 15, 0.3);
      box-shadow: 0 0 20px rgba(241, 196, 15, 0.2);
    }

    .success {
      color: #0f0;
      margin: 5px 0;
    }

    .error {
      color: #f00;
      margin: 5px 0;
      font-weight: bold;
    }

    .warning {
      color: #f39c12;
      margin: 5px 0;
    }

    .info {
      color: #3498db;
      margin: 5px 0;
    }

    pre {
      background: #111;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      color: #0f0;
      font-size: 12px;
      border: 1px solid #333;
      max-height: 500px;
      overflow-y: auto;
    }

    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      border-left: 3px solid #f1c40f;
    }

    .stat-box {
      display: inline-block;
      padding: 10px 20px;
      margin: 5px;
      background: rgba(241, 196, 15, 0.1);
      border-radius: 5px;
      border: 1px solid rgba(241, 196, 15, 0.3);
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }

    .badge-success {
      background: #2ecc71;
      color: #000;
    }

    .badge-error {
      background: #e74c3c;
      color: #fff;
    }

    button {
      background: linear-gradient(135deg, #f1c40f, #d4ac0d);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 5px;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
    }

    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, #f1c40f, transparent);
      margin: 30px 0;
    }

    .loading-screen {
      text-align: center;
      padding: 50px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(241, 196, 15, 0.2);
      border-top-color: #f1c40f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .loading {
      animation: blink 1s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 TESTE DE CONFIGURAÇÃO - SUMMIT GLOBAL INVEST</h1>
    
    <div id="loading" class="loading-screen">
      <div class="spinner"></div>
      <p class="loading">Carregando config.js...</p>
    </div>

    <div id="results" style="display:none;"></div>

    <div class="divider" style="display:none;" id="divider"></div>

    <div style="text-align: center; margin-top: 30px; display:none;" id="buttons">
      <button onclick="location.reload()">🔄 Recarregar Teste</button>
      <button onclick="window.location.href='index.html'">🏠 Ir para Home</button>
      <button onclick="window.location.href='login.html'">🔐 Ir para Login</button>
    </div>
  </div>

  <script>
    // Impede redirecionamento
    window.stop();

    // Carrega config.js dinamicamente
    (function loadConfig() {
      const script = document.createElement('script');
      script.src = 'js/config.js';
      script.onload = function() {
        console.log('✅ config.js carregado com sucesso');
        setTimeout(runTests, 500);
      };
      script.onerror = function() {
        console.error('❌ Erro ao carregar config.js');
        document.getElementById('loading').innerHTML = `
          <p class="error">❌ ERRO: Não foi possível carregar js/config.js</p>
          <p class="warning">Verifique se o arquivo existe no caminho: <code>js/config.js</code></p>
          <button onclick="location.reload()">🔄 Tentar Novamente</button>
        `;
      };
      document.head.appendChild(script);
    })();

    function runTests() {
      // Esconde loading
      document.getElementById('loading').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      document.getElementById('divider').style.display = 'block';
      document.getElementById('buttons').style.display = 'block';

      const results = document.getElementById('results');
      let html = '';
      let totalTests = 0;
      let passedTests = 0;

      // ========================================================
      // TESTE 1: CONFIG EXISTE?
      // ========================================================
      html += '<div class="test-section">';
      html += '<h2>📦 Teste 1: Objeto CONFIG</h2>';

      totalTests++;
      if (typeof CONFIG !== 'undefined' && CONFIG !== null) {
        passedTests++;
        html += '<p class="success">✅ CONFIG carregado com sucesso</p>';
        html += `<p class="info">📍 Tipo: ${typeof CONFIG}</p>`;
      } else if (typeof SUMMIT_CONFIG !== 'undefined') {
        passedTests++;
        window.CONFIG = window.SUMMIT_CONFIG;
        html += '<p class="success">✅ SUMMIT_CONFIG carregado (alias criado)</p>';
      } else {
        html += '<p class="error">❌ CONFIG não foi carregado!</p>';
        html += '<p class="warning">⚠️ Verifique se js/config.js está no caminho correto.</p>';
      }
      html += '</div>';

      // ========================================================
      // TESTE 2: PROPRIEDADES ESSENCIAIS
      // ========================================================
      if (typeof CONFIG !== 'undefined' || typeof SUMMIT_CONFIG !== 'undefined') {
        const cfg = CONFIG || SUMMIT_CONFIG;
        
        html += '<div class="test-section">';
        html += '<h2>🔑 Teste 2: Propriedades Essenciais</h2>';

        const essentials = [
          { key: 'environment', expected: 'string' },
          { key: 'version', expected: 'string' },
          { key: 'apiURL', expected: 'string' },
          { key: 'storage', expected: 'object' },
          { key: 'auth', expected: 'object' },
          { key: 'paths', expected: 'object' },
          { key: 'api', expected: 'object' },
          { key: 'validation', expected: 'object' },
          { key: 'plans', expected: 'object' },
          { key: 'career', expected: 'object' }
        ];

        essentials.forEach(({ key, expected }) => {
          totalTests++;
          if (cfg[key] && typeof cfg[key] === expected) {
            passedTests++;
            html += `<p class="success">✅ CONFIG.${key} (${expected})</p>`;
          } else {
            html += `<p class="error">❌ CONFIG.${key} não encontrado ou tipo incorreto</p>`;
          }
        });

        html += '</div>';

        // ========================================================
        // TESTE 3: MÉTODOS
        // ========================================================
        html += '<div class="test-section">';
        html += '<h2>⚙️ Teste 3: Métodos Disponíveis</h2>';

        const methods = [
          'getURL',
          'getAssetPath',
          'isDev',
          'getStorageKey',
          'log',
          'validate',
          'getPlanByValue'
        ];

        methods.forEach(method => {
          totalTests++;
          if (typeof cfg[method] === 'function') {
            passedTests++;
            html += `<p class="success">✅ CONFIG.${method}() disponível</p>`;
          } else {
            html += `<p class="error">❌ CONFIG.${method}() não encontrado</p>`;
          }
        });

        html += '</div>';

        // ========================================================
        // TESTE 4: VALORES IMPORTANTES
        // ========================================================
        html += '<div class="test-section">';
        html += '<h2>📊 Teste 4: Valores Configurados</h2>';

        html += '<div class="stat-box">';
        html += `<strong>Ambiente:</strong> ${cfg.environment}`;
        html += `<span class="badge ${cfg.isDevelopment ? 'badge-error' : 'badge-success'}">${cfg.isDevelopment ? 'DEV' : 'PROD'}</span>`;
        html += '</div>';

        html += '<div class="stat-box">';
        html += `<strong>Versão:</strong> ${cfg.version}`;
        html += '</div>';

        html += '<div class="stat-box">';
        html += `<strong>API URL:</strong> ${cfg.apiURL}`;
        html += '</div>';

        html += '<div class="stat-box">';
        html += `<strong>Base Path:</strong> ${cfg.basePath || '(raiz)'}`;
        html += '</div>';

        html += '</div>';

        // ========================================================
        // TESTE 5: STORAGE KEYS
        // ========================================================
        html += '<div class="test-section">';
        html += '<h2>💾 Teste 5: Storage Keys (Namespace)</h2>';

        const storageKeys = Object.keys(cfg.storage);
        html += `<p class="info">Total de chaves: ${storageKeys.length}</p>`;

        storageKeys.forEach(key => {
          totalTests++;
          if (cfg.storage[key].startsWith('sg_v2_')) {
            passedTests++;
            html += `<p class="success">✅ ${key}: <code>${cfg.storage[key]}</code></p>`;
          } else {
            html += `<p class="warning">⚠️ ${key}: <code>${cfg.storage[key]}</code> (sem namespace sg_v2_)</p>`;
          }
        });

        html += '</div>';

        // ========================================================
        // TESTE 6: PLANOS DE INVESTIMENTO
        // ========================================================
        html += '<div class="test-section">';
        html += '<h2>💎 Teste 6: Planos de Investimento</h2>';

        const testValues = [500, 2500, 7500, 15000, 30000, 75000];
        
        testValues.forEach(value => {
          totalTests++;
          const plan = cfg.getPlanByValue(value);
          if (plan) {
            passedTests++;
            html += `<p class="success">✅ R$ ${value.toLocaleString('pt-BR')} → ${plan.label} (${(plan.rate * 100).toFixed(2)}%/dia)</p>`;
          } else {
            html += `<p class="error">❌ Nenhum plano encontrado para R$ ${value.toLocaleString('pt-BR')}</p>`;
          }
        });

        html += '</div>';

        // ========================================================
        // TESTE 7: VALIDAÇÕES
        // ========================================================
        html += '<div class="test-section">';
        html += '<h2>✅ Teste 7: Sistema de Validação</h2>';

        const validationTests = [
          { field: 'username', value: 'teste123', shouldPass: true },
          { field: 'username', value: 'ab', shouldPass: false },
          { field: 'email', value: 'teste@email.com', shouldPass: true },
          { field: 'email', value: 'email_invalido', shouldPass: false },
          { field: 'password', value: 'senha123', shouldPass: true },
          { field: 'password', value: '12345', shouldPass: false }
        ];

        validationTests.forEach(test => {
          totalTests++;
          const result = cfg.validate(test.field, test.value);
          const passed = result.valid === test.shouldPass;
          
          if (passed) {
            passedTests++;
            html += `<p class="success">✅ ${test.field}: "${test.value}" → ${result.valid ? 'válido' : 'inválido'} (esperado)</p>`;
          } else {
            html += `<p class="error">❌ ${test.field}: "${test.value}" → resultado inesperado</p>`;
          }
        });

        html += '</div>';

        // ========================================================
        // CONFIGURAÇÃO COMPLETA
        // ========================================================
        html += '<div class="test-section">';
        html += '<h2>📋 Configuração Completa (JSON)</h2>';
        html += '<pre>' + JSON.stringify(cfg, null, 2) + '</pre>';
        html += '</div>';
      }

      // ========================================================
      // RESUMO FINAL
      // ========================================================
      html += '<div class="test-section" style="border-left-color: ' + (passedTests === totalTests ? '#2ecc71' : '#e74c3c') + ';">';
      html += '<h2>📊 Resumo Final</h2>';
      
      const percentage = Math.round((passedTests / totalTests) * 100);
      const status = percentage === 100 ? '✅ TODOS OS TESTES PASSARAM!' : 
                     percentage >= 80 ? '⚠️ MAIORIA DOS TESTES PASSOU' : 
                     '❌ MUITOS TESTES FALHARAM';

      html += `<h1 style="text-align:center; color: ${percentage === 100 ? '#0f0' : percentage >= 80 ? '#f39c12' : '#f00'};">${status}</h1>`;
      html += `<p style="text-align:center; font-size:24px; margin:20px 0;">`;
      html += `<strong>${passedTests}/${totalTests}</strong> testes passaram (${percentage}%)`;
      html += `</p>`;

      if (percentage === 100) {
        html += '<p class="success" style="text-align:center; font-size:18px;">🎉 Sistema de configuração está 100% funcional!</p>';
        html += '<p class="info" style="text-align:center;">✅ Você pode prosseguir para o PASSO 3.</p>';
      } else {
        html += '<p class="error" style="text-align:center;">⚠️ Alguns testes falharam. Verifique os erros acima.</p>';
      }

      html += '</div>';

      results.innerHTML = html;

      // ========================================================
      // LOG NO CONSOLE
      // ========================================================
      console.log('🔍 TESTE DE CONFIGURAÇÃO SUMMIT GLOBAL');
      console.log('=====================================');
      console.log(`Testes passados: ${passedTests}/${totalTests} (${percentage}%)`);
      console.log('CONFIG:', CONFIG || SUMMIT_CONFIG);
      console.log('=====================================');
    }
  </script>
</body>

          html += `<p class="success">✅ ${test.field}: "${test.value}" → ${result.valid ? 'válido' : 'inválido'} (esperado)</p>`;
        } else {
          html += `<p class="error">❌ ${test.field}: "${test.value}" → resultado inesperado</p>`;
        }
      });

      html += '</div>';

      // ========================================================
      // CONFIGURAÇÃO COMPLETA
      // ========================================================
      html += '<div class="test-section">';
      html += '<h2>📋 Configuração Completa (JSON)</h2>';
      html += '<pre>' + JSON.stringify(CONFIG, null, 2) + '</pre>';
      html += '</div>';
    }

    // ========================================================
    // RESUMO FINAL
    // ========================================================
    html += '<div class="test-section" style="border-left-color: ' + (passedTests === totalTests ? '#2ecc71' : '#e74c3c') + ';">';
    html += '<h2>📊 Resumo Final</h2>';
    
    const percentage = Math.round((passedTests / totalTests) * 100);
    const status = percentage === 100 ? '✅ TODOS OS TESTES PASSARAM!' : 
                   percentage >= 80 ? '⚠️ MAIORIA DOS TESTES PASSOU' : 
                   '❌ MUITOS TESTES FALHARAM';

    html += `<h1 style="text-align:center; color: ${percentage === 100 ? '#0f0' : percentage >= 80 ? '#f39c12' : '#f00'};">${status}</h1>`;
    html += `<p style="text-align:center; font-size:24px; margin:20px 0;">`;
    html += `<strong>${passedTests}/${totalTests}</strong> testes passaram (${percentage}%)`;
    html += `</p>`;

    if (percentage === 100) {
      html += '<p class="success" style="text-align:center; font-size:18px;">🎉 Sistema de configuração está 100% funcional!</p>';
      html += '<p class="info" style="text-align:center;">Você pode prosseguir para o PASSO 3.</p>';
    } else {
      html += '<p class="error" style="text-align:center;">⚠️ Alguns testes falharam. Verifique os erros acima.</p>';
    }

    html += '</div>';

    results.innerHTML = html;

    // ========================================================
    // LOG NO CONSOLE
    // ========================================================
    console.log('🔍 TESTE DE CONFIGURAÇÃO SUMMIT GLOBAL');
    console.log('=====================================');
    console.log(`Testes passados: ${passedTests}/${totalTests} (${percentage}%)`);
    console.log('CONFIG:', CONFIG);
    console.log('=====================================');
  </script>
</body>
</html>
