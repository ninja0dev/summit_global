<!-- cliente/sections/rede.html -->
<section class="section" id="rede">
  <h2 style="color:var(--gold); text-align:center; margin-bottom:20px;">
    🌐 Minha Rede (Simulação — Diamante Roxo)
  </h2>

  <!-- Resumo da Rede -->
  <div class="network-stats">
    <div class="stat-card" id="card-diretos">
      Diretos
      <span id="resumo-diretos">10</span>
    </div>
    <div class="stat-card" id="card-equipe">
      Equipe Total
      <span id="resumo-equipe">54</span>
    </div>
    <div class="stat-card" id="card-ativos">
      Ativos
      <span id="resumo-ativos">44</span>
    </div>
    <div class="stat-card" id="card-inativos">
      Inativos
      <span id="resumo-inativos">10</span>
    </div>
    <div class="stat-card">
      Volume
      <span id="resumo-volume">R$ 1.250.000</span>
    </div>
  </div>

  <!-- Detalhes dos Usuários -->
  <div class="card" style="margin-top:30px;">
    <h3 style="color:var(--gold);">👥 Detalhes da Rede</h3>
    <div class="user-grid" id="rede-detalhes">
      <!-- preenchido dinamicamente pelo dashboard.js -->
    </div>
  </div>
</section>
